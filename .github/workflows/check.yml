name: check

on:
  push:
    branches: [main]
  schedule:
    # Drift here is caused by a port publishing a new release, not by a
    # commit to this repo -- a push-only trigger would never catch that.
    # Daily is enough; nothing about a version bump is that time-sensitive.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      # Pushes only verify; they never write (the bot's own commit is a push).
      - if: github.event_name == 'push'
        run: python3 gen_versions.py --check
      - if: github.event_name != 'push'
        run: python3 gen_versions.py --write
      - if: github.event_name != 'push'
        run: |
          if git diff --quiet -- index.html; then
            echo "Versions already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Landing page: update port versions from registries"
          git push origin HEAD:main
